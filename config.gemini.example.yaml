# Gemini-only setup: needs only GEMINI_API_KEY in item_metrics/.env.
# All models share one vendor (google), so the spec's 2-vendor rule cannot hold. allow_single_vendor turns it into
# a warning and the report carries a note: agreement-based numbers are weaker when every checker is a Gemini model.
# Using different Gemini models per role (flash vs pro vs flash-lite) still keeps them from being one model.
# Check which models your key can use; these ids are from LiteLLM's model list.
generator_model: null            # if the items were written by a Gemini model, name it here so it is not a checker
allow_single_vendor: true

models:
  solvers:
    - gemini/gemini-2.5-flash
    - gemini/gemini-2.5-pro
    - gemini/gemini-3.5-flash
  verifier: []
  judges:
    - gemini/gemini-2.5-flash
    - gemini/gemini-3.5-flash
  mutator: gemini/gemini-2.5-pro
  mutation_validator: gemini/gemini-2.5-flash-lite   # differs from the mutator and every judge
  topic_classifiers:
    - gemini/gemini-2.5-flash
    - gemini/gemini-3.5-flash
  embedding: null                # e.g. gemini/gemini-embedding-001 to add the embedding rank

llm:
  temperature: 0
  max_concurrency: 2             # free-tier keys have low requests-per-minute quotas
  timeout_s: 180
  max_retries: 6
  retry_max_wait_s: 65           # Gemini 429s ask to wait up to about a minute
  key_rotation: failover         # several GEMINI_API_KEY_n: failover (one at a time) or round_robin
  key_cooldown_s: 5              # first rest for a rate-limited key; doubles up to retry_max_wait_s
  json_mode: true
  cache_dir: .cache/llm
  max_cost_usd: 5.0

seed: 1234

numeric:
  default_tolerance: 0.02
  tolerance_cap: 0.02
  planted_perturbations: [0.03, 0.05, 0.10]

key_consensus:
  gate_rule: all
  shuffle_options: true

judge_mutation:
  judge_runs: 2
  paraphrase_controls: 2
  require_human_validation: false

topic_blind:
  top_k: 3
  min_topics_warning: 4

column_map: {}
